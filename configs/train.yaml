# LoRA SFT of Llama-3.1-8B-Instruct on data/qa_clean (chapter replication).
# Chapter hyperparameters are kept as is; hardware deviations are applied in src/train_lora.py and logged.
base_model: meta-llama/Llama-3.1-8B-Instruct            # reference model id (gated; license accepted)
load_model: unsloth/Meta-Llama-3.1-8B-Instruct-bnb-4bit # what is actually loaded when VRAM < 40 GB (same weights, NF4)
load_model_16bit: unsloth/Meta-Llama-3.1-8B-Instruct    # used when VRAM >= 40 GB (16-bit LoRA as in the chapter)
vram_16bit_min_gb: 40

train_file: data/qa_clean/train_chat.jsonl
train_meta: data/qa_clean/train.jsonl     # same row order; provides file_id for the by-PDF validation split
val_frac_pdfs: 0.02                       # 2 % of train PDFs held out as validation

output_dir: outputs/llama31-8b-ls-lora
checkpoint_dir: outputs/checkpoints

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  epochs: 1
  learning_rate: 3.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.03
  per_device_batch_size: 1
  grad_accum: 16
  max_seq_len: 2048
  logging_steps: 10
  eval_steps: 100
  save_steps: 200
  save_total_limit: 3
  seed: 42
  gradient_checkpointing: false   # set to "unsloth" automatically on OOM
  optim: adamw_8bit
  weight_decay: 0.0
  max_hours: 7.0                  # if the projected epoch is longer, train on a random subset that fits
